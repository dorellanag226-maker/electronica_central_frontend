openapi: 3.0.3
info:
  title: Electrónica Central AZ API
  version: 0.1.0
  description: "API backend de Electrónica Central AZ. Auth Bearer JWT. Zona
    reportes: America/La_Paz."
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Health
  - name: Auth
  - name: CatalogoPublico
  - name: Catalogo
  - name: Seguridad
  - name: Clientes
  - name: Inventario
  - name: Proveedores
  - name: Compras
  - name: Ventas
  - name: Pagos
  - name: Solicitudes
  - name: Reportes
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /ready:
    get:
      operationId: getReady
      summary: Readiness (PostgreSQL)
      tags:
        - Health
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/auth/registro:
    post:
      operationId: authRegister
      summary: Registro cliente
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombreUsuario
                - correo
                - contrasena
                - nombre
              properties:
                nombreUsuario:
                  type: string
                  minLength: 3
                correo:
                  type: string
                  format: email
                contrasena:
                  type: string
                  minLength: 12
                nombre:
                  type: string
                telefono:
                  type: string
            example:
              nombreUsuario: ejemplo-nombreUsuario
              correo: demo@example.test
              contrasena: ClaveDePruebaSegura123
              nombre: ejemplo-nombre
              telefono: ejemplo-telefono
  /api/auth/login:
    post:
      operationId: authLogin
      summary: Login
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identificador
                - contrasena
              properties:
                identificador:
                  type: string
                contrasena:
                  type: string
            example:
              identificador: "{{adminEmail}}"
              contrasena: ClaveDePruebaSegura123
  /api/auth/me:
    get:
      operationId: authMe
      summary: Perfil sesión
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: Cerrar sesión
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
  /api/auth/cambiar-contrasena:
    post:
      operationId: authChangePassword
      summary: Cambiar contraseña
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contrasenaActual
                - contrasenaNueva
              properties:
                contrasenaActual:
                  type: string
                contrasenaNueva:
                  type: string
                  minLength: 12
            example:
              contrasenaActual: ClaveDePruebaSegura123
              contrasenaNueva: ClaveDePruebaSegura123
  /api/auth/recuperar-contrasena:
    post:
      operationId: authRequestPasswordReset
      summary: Solicitar enlace de recuperación de contraseña
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
              properties:
                correo:
                  type: string
                  format: email
            example:
              correo: demo@example.test
  /api/auth/restablecer-contrasena:
    post:
      operationId: authResetPassword
      summary: Restablecer contraseña con el enlace recibido
      tags:
        - Auth
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - contrasenaNueva
                - confirmacionContrasena
              properties:
                token:
                  type: string
                  example: "{{resetToken}}"
                contrasenaNueva:
                  type: string
                  minLength: 8
                confirmacionContrasena:
                  type: string
                  minLength: 8
            example:
              token: "{{resetToken}}"
              contrasenaNueva: ClaveDePruebaSegura123
              confirmacionContrasena: ejemplo-confirmacionContrasena
  /api/catalogo/productos:
    get:
      operationId: catalogPublicList
      summary: Catálogo público
      tags:
        - CatalogoPublico
      parameters:
        - name: buscar
          in: query
          required: false
          schema:
            type: string
        - name: idCategoria
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: idMarca
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: idModelo
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/catalogo/productos/{id}:
    get:
      operationId: catalogPublicGet
      summary: Producto público
      tags:
        - CatalogoPublico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/catalogo/filtros:
    get:
      operationId: catalogFilters
      summary: Filtros catálogo
      tags:
        - CatalogoPublico
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security: []
  /api/categorias:
    post:
      operationId: createCategoria
      summary: Crear categoría
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
  /api/marcas:
    post:
      operationId: createMarca
      summary: Crear marca
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
            example:
              nombre: ejemplo-nombre
    get:
      operationId: listMarcas
      summary: Listar marcas
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_CONSULTAR` (o roles Admin/Dev según seed).
  /api/unidades:
    post:
      operationId: createUnidad
      summary: Crear unidad
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - simbolo
              properties:
                nombre:
                  type: string
                simbolo:
                  type: string
                permiteFraccion:
                  type: boolean
                  default: false
            example:
              nombre: ejemplo-nombre
              simbolo: ejemplo-simbolo
              permiteFraccion: false
  /api/ubicaciones:
    post:
      operationId: createUbicacion
      summary: Crear ubicación
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
                - pasillo
                - estante
              properties:
                codigo:
                  type: string
                pasillo:
                  type: string
                estante:
                  type: string
            example:
              codigo: ejemplo-codigo
              pasillo: ejemplo-pasillo
              estante: ejemplo-estante
    get:
      operationId: listUbicaciones
      summary: Listar ubicaciones
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_CONSULTAR` (o roles Admin/Dev según seed).
  /api/modelos:
    post:
      operationId: createModelo
      summary: Crear modelo
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - idMarca
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                idMarca:
                  type: string
                  format: uuid
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              idMarca: "{{idMarca}}"
    get:
      operationId: listModelos
      summary: Listar modelos (opcional por marca)
      tags:
        - Catalogo
      parameters:
        - name: idMarca
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_CONSULTAR` (o roles Admin/Dev según seed).
  /api/marcas/{id}:
    patch:
      operationId: updateMarca
      summary: Editar marca
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
            example:
              nombre: ejemplo-nombre
  /api/modelos/{id}:
    patch:
      operationId: updateModelo
      summary: Editar modelo
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                idMarca:
                  type: string
                  format: uuid
            example:
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              idMarca: "{{idMarca}}"
  /api/ubicaciones/{id}:
    patch:
      operationId: updateUbicacion
      summary: Editar ubicación
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
                pasillo:
                  type: string
                estante:
                  type: string
            example:
              codigo: ejemplo-codigo
              pasillo: ejemplo-pasillo
              estante: ejemplo-estante
  /api/ubicaciones/{id}/productos:
    patch:
      operationId: assignUbicacionProductos
      summary: Asignar ubicación a productos
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idProductos
              properties:
                idProductos:
                  type: array
                  items:
                    type: string
                    format: uuid
            example:
              idProductos: []
  /api/productos:
    post:
      operationId: createProducto
      summary: Crear producto
      tags:
        - Catalogo
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
                - nombre
                - precioVenta
                - idCategoria
                - idUnidadMedida
                - idUbicacion
              properties:
                codigo:
                  type: string
                nombre:
                  type: string
                descripcion:
                  type: string
                precioVenta:
                  type: number
                idCategoria:
                  type: string
                  format: uuid
                idUnidadMedida:
                  type: string
                  format: uuid
                idUbicacion:
                  type: string
                  format: uuid
                idMarca:
                  type: string
                  format: uuid
                idModelo:
                  type: string
                  format: uuid
                stockMinimo:
                  type: number
                  default: 0
            example:
              codigo: ejemplo-codigo
              nombre: ejemplo-nombre
              descripcion: ejemplo-descripcion
              precioVenta: 1
              idCategoria: "{{idCategoria}}"
              idUnidadMedida: "{{idUnidadMedida}}"
              idUbicacion: "{{idUbicacion}}"
              idMarca: "{{idMarca}}"
              idModelo: "{{idModelo}}"
              stockMinimo: 0
  /api/productos/{id}:
    patch:
      operationId: deactivateProducto
      summary: Editar producto (datos, estado o ubicación)
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activo:
                  type: boolean
                  example: false
                idUbicacion:
                  type: string
                  format: uuid
            example:
              activo: false
              idUbicacion: "{{idUbicacion}}"
  /api/productos/{id}/compatibilidades:
    post:
      operationId: createCompatibilidad
      summary: Alta compatibilidad
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idModelo
              properties:
                idModelo:
                  type: string
                  format: uuid
                observaciones:
                  type: string
            example:
              idModelo: "{{idModelo}}"
              observaciones: ejemplo-observaciones
  /api/productos/{id}/compatibilidades/{idModelo}:
    delete:
      operationId: deleteCompatibilidad
      summary: Borrar compatibilidad
      tags:
        - Catalogo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: idModelo
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Business rule
      security:
        - bearerAuth: []
      description: Requiere permiso `CATALOGO_GESTIONAR` (o roles Admin/Dev según seed).
  /api/usuarios:
    get:
      operationId: listUsuarios
      summary: Listar usuarios
      tags:
        - Seguridad
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
